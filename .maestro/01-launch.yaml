appId: io.dynolabs.cinova
---
# Smoke gate — proves the app reaches first interactive frame without
# crashing on native bridge / missing autolinked module / fatal JS error.
#
# Why we don't assert on tab labels: cinova's tab bar uses icon-only labels
# (mobile/app/(tabs)/_layout.tsx — TabIcon component, no `tabBarLabel`),
# so there's no visible "Home" text to assert on. Adding testIDs would
# require an app code change + rebuild.
#
# Why we don't assert on Home content: cinova's Home tab pre-fetches
# `getDiscoverFeed` from api.cinova.openova.io. The backend is intentionally
# scaled-to-0 in dev (openova-private commit faeffea2 suspended the Flux
# Kustomization), so Home renders an empty state. That's by design, not a
# bug — asserting visible content would couple the build gate to a live
# backend.
#
# The native-crash detection in the workflow (grep over sim.log for SIGABRT
# / EXC_BAD_ACCESS / "Terminating app due to uncaught exception") is the
# secondary gate: even if maestro reports flow passed, a native crash in
# the bridge fails the run independently.
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: "smoke-launched"
# If the JS ErrorBoundary fires or a system crash dialog appears, fail
# the gate. None of these strings are present in cinova's normal UX —
# any match means something broke.
- assertNotVisible: "Something went wrong"
- assertNotVisible: "An error occurred"
- assertNotVisible: "Unable to load"
- assertNotVisible: "Application Error"
