appId: io.dynolabs.cinova
---
# Walk every tab → screenshot each surface. Same Cinova.app bytes as
# TestFlight build 14, same iOS runtime. Tabs use `title:` in
# Tabs.Screen options — React Navigation exposes these as accessibility
# labels even though tab bar is icon-only visually.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 30000

# Home tab (default landing)
- takeScreenshot: walk-1-home

# Reels
- tapOn:
    text: "Reels"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: walk-2-reels

# Discover (vertical-trailer grid)
- tapOn:
    text: "Discover"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: walk-3-discover

# Watchlist
- tapOn:
    text: "Watchlist"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: walk-4-watchlist

# Profile
- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: walk-5-profile

# Chat FAB (floating button — opens chat modal)
- tapOn:
    id: "chat-fab"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: walk-6-chat-or-final
