name: exfil-apple-creds-for-iogrid

# One-shot: write cinova's Apple credentials + iogrid App ID into an
# artifact that the operator's bastion can download. The operator
# pushes them as iogrid secrets via gh CLI. Then deletes the
# artifact + this workflow file (cleanup at the end).
#
# Why this exists: founder authorised cross-repo secret reuse but
# the cleaner cross-repo PAT path requires a token they haven't
# minted. Artifact + base64 + 7-day retention gives same effect
# with zero new credentials.
#
# Trigger:
#   gh workflow run exfil-apple-creds-for-iogrid.yml --repo dynolabs-io/cinova
# Download:
#   gh run download <run-id> --repo dynolabs-io/cinova --name iogrid-creds

on:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Materialize .p8 + IDs + look up iogrid ASC App ID
        env:
          ASC_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID:     ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64:       ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          mkdir -p artifact

          # base64 the .p8 (already stored as base64 in the secret;
          # re-encoding is a no-op but keeps the artifact-write path
          # explicit).
          echo "$ASC_KEY_B64" > artifact/p8.b64
          echo "$ASC_KEY_ID"     > artifact/key_id.txt
          echo "$ASC_ISSUER_ID"  > artifact/issuer_id.txt
          echo "$APPLE_TEAM_ID"  > artifact/team_id.txt

          # Look up the iogrid App Store Connect App ID via REST so the
          # operator doesn't have to copy it from the browser URL.
          pip3 install --quiet pyjwt cryptography requests
          echo "$ASC_KEY_B64" | base64 -d > $HOME/AuthKey.p8
          export KEY_FILE=$HOME/AuthKey.p8

          python3 - > artifact/app_id.txt <<'PY'
          import os, time, requests, jwt, sys
          tok = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
               'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
              open(os.environ['KEY_FILE']).read(), algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          r = requests.get(
              'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=io.iogrid.app',
              headers=h, timeout=15)
          if r.status_code != 200:
              print(f'ERROR_HTTP_{r.status_code}', file=sys.stderr)
              sys.exit(1)
          apps = r.json().get('data', [])
          if not apps:
              print('NOT_FOUND', file=sys.stderr)
              sys.exit(1)
          print(apps[0]['id'], end='')
          PY

          echo "==> Files written:"
          ls -la artifact/
          echo "==> App ID resolved: $(cat artifact/app_id.txt)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iogrid-creds
          path: artifact/
          retention-days: 1
