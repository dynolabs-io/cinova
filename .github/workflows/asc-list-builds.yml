name: asc-list-builds (one-shot diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests
          key_blob = os.environ['PRIVATE_KEY_B64']
          try:
              decoded = base64.b64decode(key_blob)
              key = decoded if decoded.startswith(b'-----BEGIN') else key_blob.encode()
          except Exception:
              key = key_blob.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          base = 'https://api.appstoreconnect.apple.com'
          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          if not apps.get('data'):
              print('::error::App not found'); raise SystemExit(1)
          app_id = apps['data'][0]['id']
          print(f'App ID: {app_id}  Name: {apps["data"][0]["attributes"]["name"]}')
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&limit=20&sort=-uploadedDate', headers=h).json()
          print(f'\n=== Builds ({len(builds.get("data", []))}) ===')
          for b in builds.get('data', []):
              a = b['attributes']
              print(f"  id={b['id']} version={a.get('version')} processingState={a.get('processingState')} uploadedDate={a.get('uploadedDate')} expired={a.get('expired')}")
          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h).json()
          print(f'\n=== Beta groups ===')
          for g in groups.get('data', []):
              a = g['attributes']
              print(f"  id={g['id']} name={a.get('name')} isInternal={a.get('isInternalGroup')} publicLink={a.get('publicLinkEnabled')}")
          PY
