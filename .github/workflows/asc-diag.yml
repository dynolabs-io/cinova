name: asc-diag (one-shot)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          base = 'https://api.appstoreconnect.apple.com'

          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          app_id = apps['data'][0]['id']
          name = apps['data'][0]['attributes']['name']
          print(f'=== App {name} ({app_id}) ===')

          # All builds with full attrs
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&limit=10&sort=-uploadedDate', headers=h).json()
          for b in builds.get('data', []):
              a = b['attributes']
              print(f"\nBuild {a.get('version')} id={b['id']}")
              for k in ['processingState','usesNonExemptEncryption','expired','minOsVersion','iconAssetToken','lsMinimumSystemVersion','uploadedDate']:
                  print(f"  {k}: {a.get(k)}")
              # Get beta group assignments for this build
              bg = requests.get(f'{base}/v1/builds/{b["id"]}/betaGroups', headers=h).json()
              print(f"  betaGroups assigned: {[g['attributes']['name'] for g in bg.get('data', [])]}")
              # Get beta-build-localizations + buildBetaDetails (testflight-ready check)
              bbd = requests.get(f'{base}/v1/builds/{b["id"]}/buildBetaDetail', headers=h).json()
              if 'data' in bbd and bbd['data']:
                  bba = bbd['data']['attributes']
                  print(f"  buildBetaDetail.internalBuildState: {bba.get('internalBuildState')}")
                  print(f"  buildBetaDetail.externalBuildState: {bba.get('externalBuildState')}")
                  print(f"  buildBetaDetail.autoNotifyEnabled: {bba.get('autoNotifyEnabled')}")

          # Beta groups + testers + builds
          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}&include=betaTesters,builds', headers=h).json()
          print(f"\n=== Beta groups + members ===")
          for g in groups.get('data', []):
              a = g['attributes']
              print(f"\nGroup {a['name']} id={g['id']}")
              print(f"  isInternal: {a.get('isInternalGroup')}")
              print(f"  hasAccessToAllBuilds: {a.get('hasAccessToAllBuilds')}")
              # Testers
              testers = requests.get(f'{base}/v1/betaGroups/{g["id"]}/betaTesters', headers=h).json()
              print(f"  testers ({len(testers.get('data', []))}):")
              for t in testers.get('data', []):
                  ta = t['attributes']
                  print(f"    - {ta.get('email')} firstName={ta.get('firstName')} state={ta.get('state')}")
              # Builds
              gbuilds = requests.get(f'{base}/v1/betaGroups/{g["id"]}/builds', headers=h).json()
              print(f"  assigned builds ({len(gbuilds.get('data', []))}):")
              for gb in gbuilds.get('data', []):
                  print(f"    - id={gb['id']} version={gb['attributes'].get('version')}")
          PY
