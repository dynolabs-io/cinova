name: asc-poll
on:
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          base = 'https://api.appstoreconnect.apple.com'
          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          app_id = apps['data'][0]['id']
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&filter[version]=14', headers=h).json()
          build_id = builds['data'][0]['id']
          # ind testers
          ind = requests.get(f'{base}/v1/builds/{build_id}/individualTesters', headers=h).json()
          print(f"individualTesters: {len(ind.get('data', []))}")
          for t in ind.get('data', []):
              print(f"  - {t['attributes'].get('email')} state={t['attributes'].get('state')}")
          # Each tester's build visibility
          for email in ['hatyil@gmail.com', 'emrahbaysal@gmail.com']:
              tt = requests.get(f'{base}/v1/betaTesters?filter[email]={email}', headers=h).json()
              for r in tt.get('data', []):
                  ab = requests.get(f'{base}/v1/betaTesters/{r["id"]}/builds', headers=h).json()
                  print(f"  {email} sees {len(ab.get('data', []))} builds: {[b['attributes'].get('version') for b in ab.get('data', [])]}")
          PY
