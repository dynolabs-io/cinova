name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.maestro/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Apple requires iOS 26 SDK (Xcode 26+) for App Store uploads as of
      # 2026-04. Default macos-latest may still have an older Xcode pinned;
      # explicitly select latest-stable.
      - name: Select latest-stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Bump CFBundleVersion to GitHub run number
        # Each TestFlight upload needs a unique CFBundleVersion. Without
        # this, altool silently dedupes against the prior build with the
        # same version. github.run_number monotonically increases per
        # workflow run on this repo — perfect fit. Glob the Info.plist
        # since the directory name varies with app slug.
        run: |
          for plist in ios/*/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
            echo "  $plist → CFBundleVersion=${{ github.run_number }}"
          done

      - name: Patch Podfile — disable signing for Pod static libs + force SKIP_INSTALL=NO on app
        # Pod targets are static libraries / resource bundles — must NOT be
        # signed (else "empty code signing identity" error). Additionally
        # Xcode 26 archives end up with empty Products/Applications because
        # the auto-generated Podfile sets SKIP_INSTALL=YES on every target;
        # we force SKIP_INSTALL=NO on the user_project's app target so the
        # archive copies the .app into Products/Applications.
        run: |
          python3 << 'PY'
          import re
          p = open('ios/Podfile').read()
          snippet = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED']  = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY']    = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
            # Ensure the user project's app target is INSTALLABLE in archives
            # (Xcode 26 default of SKIP_INSTALL=YES leaves Products/Applications empty)
            installer.aggregate_targets.each do |agg|
              agg.user_project.targets.each do |target|
                target.build_configurations.each do |config|
                  if config.name == 'Release'
                    config.build_settings['SKIP_INSTALL'] = 'NO'
                    config.build_settings['INSTALL_PATH'] = '$(LOCAL_APPS_DIR)'
                    config.build_settings['DEPLOYMENT_LOCATION'] = 'YES'
                  end
                end
              end
              agg.user_project.save
            end
          """
          new, n = re.subn(r'(post_install do \|installer\|\s*\n)', r'\1' + snippet, p, count=1)
          if n == 0:
              new = p + "\npost_install do |installer|\n" + snippet + "end\n"
          open('ios/Podfile', 'w').write(new)
          print('Podfile patched')
          PY

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" \
            | base64 -d > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Create temp keychain
        # Empty keychain — fastlane cert in the next step creates a fresh
        # distribution cert in Apple's portal and imports it here. We do
        # NOT import IOS_DIST_CERT_P12 because doing so caused xcodebuild
        # to pick a revoked cert listed first in the keychain (vcard
        # ios.yml carries the same lesson at line ~110).
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          # Replace the user keychain search list with ONLY our new
          # keychain — do NOT append the existing ones. macos-latest
          # runners can carry stale "Apple Distribution: HATICE YILDIZ
          # BAYSAL" certs in the login keychain from prior CI jobs on
          # sibling Dynolabs team projects (iogrid / vcard / ping).
          # If the search list includes them, xcodebuild manual signing
          # picks the FIRST matching cert by generic name "Apple
          # Distribution" — which may be a stale revoked cert rather
          # than our freshly-fastlane-cert one, causing archive to fail.
          # Cross-port from iogrid mobile-ios-ci e912ac7 (2026-06-02).
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Ensure App ID + ASC record exist (ASC REST API, idempotent)
        # Runs ONCE per bundle ID — directly hits the ASC REST API to create:
        #   1. Apple Developer bundle ID (POST /v1/bundleIds)
        #   2. App Store Connect app record (POST /v1/apps, references the
        #      bundle ID by identifier)
        # On subsequent runs both POSTs return 409 (already exists), which the
        # script treats as success. Without this step, sigh fails the first
        # time with "Could not find App ID with bundle identifier".
        #
        # Why not `fastlane produce`: it doesn't accept --api_key_path (uses
        # Spaceship/Apple-ID 2FA auth, not API key) — confirmed in run
        # 26221253435: "invalid option: --api_key_path".
        env:
          ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          export KEY_FILE=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8
          pip3 install --quiet --break-system-packages --user pyjwt cryptography requests 2>&1 | tail -2 || true
          python3 - <<'PY'
          import os, sys, time, requests, jwt
          tok = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
               'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
              open(os.environ['KEY_FILE']).read(), algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID']})
          h = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          base = 'https://api.appstoreconnect.apple.com'
          BID = 'io.dynolabs.cinova'

          # 1. Bundle ID (Apple Developer portal)
          r = requests.get(f'{base}/v1/bundleIds?filter[identifier]={BID}', headers=h, timeout=15)
          existing = r.json().get('data', []) if r.status_code == 200 else []
          if existing:
              bundle_id_resource = existing[0]['id']
              print(f'Bundle ID already registered: {bundle_id_resource}')
          else:
              payload = {'data': {'type': 'bundleIds', 'attributes': {
                  'identifier': BID, 'name': 'Cinova', 'platform': 'IOS'}}}
              r = requests.post(f'{base}/v1/bundleIds', headers=h, json=payload, timeout=15)
              if r.status_code in (200, 201):
                  bundle_id_resource = r.json()['data']['id']
                  print(f'Created bundle ID: {bundle_id_resource}')
              else:
                  print(f'::error::Bundle ID create HTTP {r.status_code}: {r.text[:500]}')
                  sys.exit(1)

          # 1b. Enable required capabilities on the bundle ID.
          # cinova's entitlements (from expo-notifications plugin) require
          # aps-environment → maps to PUSH_NOTIFICATIONS capability. Without
          # this, xcodebuild archive fails with "Provisioning profile doesn't
          # include the aps-environment entitlement" (run 26225696674).
          required_caps = ['PUSH_NOTIFICATIONS']
          r = requests.get(f'{base}/v1/bundleIds/{bundle_id_resource}/capabilities', headers=h, timeout=15)
          existing_caps = {c['attributes']['capabilityType'] for c in r.json().get('data', [])} if r.status_code == 200 else set()
          for cap in required_caps:
              if cap in existing_caps:
                  print(f'Capability {cap}: already enabled')
                  continue
              payload = {'data': {
                  'type': 'bundleIdCapabilities',
                  'attributes': {'capabilityType': cap},
                  'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': bundle_id_resource}}},
              }}
              r = requests.post(f'{base}/v1/bundleIdCapabilities', headers=h, json=payload, timeout=15)
              if r.status_code in (200, 201):
                  print(f'Capability {cap}: enabled')
              elif r.status_code == 409:
                  print(f'Capability {cap}: already exists (409)')
              else:
                  print(f'::error::Capability {cap} POST HTTP {r.status_code}: {r.text[:400]}')
                  sys.exit(1)

          # 2. ASC app record — Apple's API does NOT allow creating apps
          # ("The resource 'apps' does not allow 'CREATE'" — confirmed in run
          # 26221495210). Report state; continue. altool will auto-create the
          # ASC record on first IPA upload if Apple's account-level setting
          # for "Auto-create apps on first build upload" is on, OR will fail
          # the upload with a precise error pointing to the ASC web UI.
          r = requests.get(f'{base}/v1/apps?filter[bundleId]={BID}', headers=h, timeout=15)
          apps = r.json().get('data', []) if r.status_code == 200 else []
          if apps:
              print(f'::notice::ASC app exists: id={apps[0]["id"]} name={apps[0]["attributes"]["name"]}')
          else:
              print(f'::warning::No ASC record for {BID} yet — altool will attempt auto-create on first upload. If altool fails with "No App in App Store Connect", create manually at https://appstoreconnect.apple.com (Apple Team {os.environ["APPLE_TEAM_ID"]}) — Apple has not exposed CREATE on the apps resource via API.')
          PY

      - name: Ensure "Founders" beta group exists (idempotent)
        # Without this, the "Assign uploaded build" step at the end warns
        # + skips, builds upload but aren't visible to testers.
        env:
          ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          export KEY_FILE=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 - <<'PY'
          import os, sys, time, requests, jwt
          tok = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
               'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
              open(os.environ['KEY_FILE']).read(), algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          base = 'https://api.appstoreconnect.apple.com'
          r = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h, timeout=15)
          apps = r.json().get('data', []) if r.status_code == 200 else []
          if not apps:
              print('::warning::ASC app does not exist yet — skipping beta group create. Will be re-attempted by the post-upload assign step.')
              sys.exit(0)
          app_id = apps[0]['id']
          r = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h, timeout=15)
          groups = [g['attributes']['name'] for g in r.json().get('data', [])]
          if 'Founders' in groups:
              print('::notice::"Founders" beta group already exists')
              sys.exit(0)
          payload = {
              'data': {
                  'type': 'betaGroups',
                  'attributes': {
                      'name': 'Founders',
                      'isInternalGroup': True,
                      'publicLinkEnabled': False,
                  },
                  'relationships': {
                      'app': {'data': {'type': 'apps', 'id': app_id}},
                  },
              }
          }
          r = requests.post(f'{base}/v1/betaGroups', headers={**h, 'Content-Type': 'application/json'}, json=payload, timeout=15)
          if r.status_code in (200, 201):
              print('::notice::Created "Founders" beta group')
          else:
              print(f'::warning::Beta group create HTTP {r.status_code}: {r.text[:300]}')
              # Don't fail the build — the assign step at the end will also warn-and-skip
          PY

      - name: Fetch fresh App Store provisioning profile via fastlane sigh
        # fastlane sigh hits Apple Developer Portal via the ASC API key,
        # regenerates the App Store profile for io.dynolabs.cinova, downloads
        # the fresh .mobileprovision, and installs it where Xcode reads it.
        # Manual signing in the archive step picks it up by
        # PROVISIONING_PROFILE_SPECIFIER name.
        env:
          FASTLANE_HIDE_CHANGELOG:    "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          export KEY_FILE=$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          export API_JSON=$RUNNER_TEMP/asc_api_key.json
          export ASC_KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          export ASC_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          python3 - <<'PY'
          import json, os
          pem = open(os.environ['KEY_FILE']).read()
          obj = {
            "key_id":   os.environ['ASC_KEY_ID'],
            "issuer_id":os.environ['ASC_ISSUER_ID'],
            "key":      pem,
            "duration": 1200,
            "in_house": False,
          }
          with open(os.environ['API_JSON'], 'w') as f:
            json.dump(obj, f)
          PY
          pip3 install --quiet --break-system-packages --user pyjwt cryptography 2>&1 | tail -2 || true
          # Pre-revoke oldest distribution cert + purge stale profiles to
          # keep us within Apple's 2-cert limit. Same logic as vcard.
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, urllib.parse
          import site
          for p in (site.getusersitepackages() if isinstance(site.getusersitepackages(), list) else [site.getusersitepackages()]):
              if p not in sys.path:
                  sys.path.insert(0, p)
          import jwt as pyjwt
          key_id    = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          pem       = open(os.environ['KEY_FILE']).read()
          tok = pyjwt.encode(
              {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
              pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
          )
          if isinstance(tok, bytes):
              tok = tok.decode()
          hdrs = {'Authorization': f'Bearer {tok}', 'Accept': 'application/json'}
          req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/certificates?limit=200',
              headers=hdrs,
          )
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          all_certs = data.get('data', [])
          dist_types = {'DISTRIBUTION', 'IOS_DISTRIBUTION'}
          certs = [c for c in all_certs if c['attributes'].get('certificateType') in dist_types]
          print(f"existing distribution certs: {len(certs)} (of {len(all_certs)} total)")
          # CROSS-PROJECT CONCURRENCY: iogrid / vcard / ping all share
          # the Dynolabs Apple Developer team and all do their own
          # pre-revoke. Revoking ALL certs would nuke a sibling's
          # just-created cert mid-archive (iogrid hit this bug at
          # iter 10/12, run 26788950651/26789892395 — sibling pre-revoke
          # destroyed the in-flight cert between its fastlane cert and
          # xcodebuild archive).
          # Heuristic: revoke only certs OLDER than 60 minutes. Apple's
          # expirationDate is set to creation+1year, so filter
          # expirationDate < (now + 365d - 60min).
          # Cross-port from iogrid mobile-ios-ci d6f2eae (2026-06-02).
          import datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          threshold = now + datetime.timedelta(days=365) - datetime.timedelta(minutes=60)
          for c in certs:
              cid = c['id']
              cname = c.get('attributes', {}).get('name', '')
              exp_str = c.get('attributes', {}).get('expirationDate', '')
              try:
                  exp = datetime.datetime.fromisoformat(exp_str.replace('Z', '+00:00'))
              except (ValueError, AttributeError):
                  print(f"  SKIP {cid} — unparseable expirationDate: {exp_str!r}")
                  continue
              if exp >= threshold:
                  age_min = round((now + datetime.timedelta(days=365) - exp).total_seconds() / 60, 1)
                  print(f"  SKIP {cid} ({cname}) — {age_min}min old, sibling CI in-flight")
                  continue
              age_h = round((now + datetime.timedelta(days=365) - exp).total_seconds() / 3600, 1)
              print(f"  revoking {cid} ({cname}) — {age_h}h old")
              dreq = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}",
                  headers=hdrs, method='DELETE',
              )
              try:
                  urllib.request.urlopen(dreq).read()
                  print('    revoked OK')
              except urllib.error.HTTPError as e:
                  print(f'    revoke HTTP {e.code}: {e.read().decode()[:200]}')

          PROFILE_NAME = "Dynolabs Cinova App Store"
          preq = urllib.request.Request(
              f'https://api.appstoreconnect.apple.com/v1/profiles?filter[name]={urllib.parse.quote(PROFILE_NAME)}&limit=200',
              headers=hdrs,
          )
          try:
              with urllib.request.urlopen(preq) as r:
                  pdata = json.load(r)
          except urllib.error.HTTPError as e:
              print(f'profiles list HTTP {e.code}: {e.read().decode()[:200]}')
              pdata = {'data': []}
          for p in pdata.get('data', []):
              pid = p['id']
              pname = p.get('attributes', {}).get('name', '')
              print(f'deleting profile {pid} ({pname})')
              dreq = urllib.request.Request(
                  f'https://api.appstoreconnect.apple.com/v1/profiles/{pid}',
                  headers=hdrs, method='DELETE',
              )
              try:
                  urllib.request.urlopen(dreq).read()
                  print('  deleted OK')
              except urllib.error.HTTPError as e:
                  print(f'  delete HTTP {e.code}: {e.read().decode()[:200]}')
          PY
          # fastlane cert creates a fresh distribution cert AND captures
          # the cert ID. We MUST pin sigh to this exact cert ID.
          fastlane cert \
            --api_key_path "$API_JSON" \
            --team_id ${{ secrets.APPLE_TEAM_ID }} \
            --output_path $RUNNER_TEMP \
            --keychain_path "$KEYCHAIN_PATH" \
            --keychain_password "$KEYCHAIN_PASSWORD" \
            2>&1 | tee "$RUNNER_TEMP/cert.log"
          NEW_CERT_ID=$(grep -oE 'Successfully generated [A-Z0-9]{10}|Found the certificate [A-Z0-9]{10}' "$RUNNER_TEMP/cert.log" \
            | head -1 | awk '{print $NF}')
          if [ -z "$NEW_CERT_ID" ]; then
            echo "::error::Could not parse cert ID from fastlane cert output"
            cat "$RUNNER_TEMP/cert.log"
            exit 1
          fi
          echo "Pinning sigh to cert ID: $NEW_CERT_ID"
          for p12 in "$RUNNER_TEMP"/*.p12; do
            [ -f "$p12" ] || continue
            echo "Importing fastlane-generated .p12: $p12"
            security import "$p12" -P "" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || true
          done
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          echo "=== identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          fastlane sigh renew \
            --api_key_path "$API_JSON" \
            --app_identifier io.dynolabs.cinova \
            --team_id ${{ secrets.APPLE_TEAM_ID }} \
            --provisioning_name "Dynolabs Cinova App Store" \
            --output_path $RUNNER_TEMP \
            --filename dist.mobileprovision \
            --cert_id "$NEW_CERT_ID" \
            --force
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$(security cms -D -i $RUNNER_TEMP/dist.mobileprovision)")
          echo "Fresh profile UUID: $UUID"
          cp $RUNNER_TEMP/dist.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Discover scheme
        id: scheme
        # Workspace schemes include Pod schemes. The app scheme matches
        # the .xcworkspace basename. Don't take schemes[0] alphabetically.
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          export APP_SCHEME
          xcodebuild -workspace "$WORKSPACE" -list -json \
            | APP_SCHEME="$APP_SCHEME" python3 -c '
          import json, sys, os
          d = json.load(sys.stdin)
          schemes = d["workspace"]["schemes"]
          want = os.environ["APP_SCHEME"]
          assert want in schemes, f"{want} not in {schemes}"
          print(f"app scheme: {want}  (out of {len(schemes)} total)")
          '
          echo "scheme=$APP_SCHEME" >> $GITHUB_OUTPUT
          echo "Discovered scheme: $APP_SCHEME"

      - name: Force SKIP_INSTALL=NO on the app target (surgical)
        # Naive regex would match every /* Release */ XCBuildConfiguration
        # including the project-level one and break the Release sim build.
        # Surgical: parse pbxproj, find PBXNativeTarget where
        # productType == application, walk buildConfigurationList, patch
        # only that target's Release config.
        run: |
          python3 << 'PY'
          import re, glob
          for pbx in glob.glob('ios/*.xcodeproj/project.pbxproj'):
              if 'Pods' in pbx:
                  continue
              data = open(pbx).read()
              target_re = re.compile(r'([0-9A-F]{24})\s*/\*\s*[^*]+\s*\*/\s*=\s*\{\s*isa = PBXNativeTarget;[^}]*?productType = "com\.apple\.product-type\.application";', re.S)
              app_targets = target_re.findall(data)
              print(f'  app targets: {app_targets}')
              for tid in app_targets:
                  m = re.search(rf'{tid}\s*/\*[^*]+\*/\s*=\s*\{{[^}}]*?buildConfigurationList = ([0-9A-F]{{24}})', data, re.S)
                  if not m:
                      continue
                  list_id = m.group(1)
                  m2 = re.search(rf'{list_id}\s*/\*[^*]+\*/\s*=\s*\{{[^}}]*?buildConfigurations = \(([^)]+)\)', data, re.S)
                  if not m2:
                      continue
                  cfg_block = m2.group(1)
                  release_id_match = re.search(r'([0-9A-F]{24})\s*/\*\s*Release\s*\*/', cfg_block)
                  if not release_id_match:
                      continue
                  rel_id = release_id_match.group(1)
                  pattern = re.compile(rf'({rel_id}\s*/\*[^*]+\*/\s*=\s*\{{\s*isa = XCBuildConfiguration;\s*buildSettings = \{{)', re.S)
                  new = pattern.sub(r'\1\n\t\t\t\tSKIP_INSTALL = NO;\n\t\t\t\tINSTALL_PATH = "$(LOCAL_APPS_DIR)";', data, count=1)
                  if new != data:
                      data = new
                      print(f'  patched target {tid} release config {rel_id}')
              open(pbx, 'w').write(data)
          PY

      # ───────────────────────────────────────────────────────────
      # SIMULATOR E2E GATE — runs BEFORE archive/upload.
      # If any Maestro flow fails, this job exits non-zero, the
      # archive + TestFlight upload steps are skipped, and the
      # broken build never reaches Apple.
      # ───────────────────────────────────────────────────────────
      - name: Build app for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -version
          DEST=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devs in d['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for x in devs:
                  if 'iPhone' in x.get('name','') and x.get('isAvailable'):
                      print(f\"platform=iOS Simulator,id={x['udid']}\")
                      sys.exit(0)
          ")
          echo "destination: $DEST"
          # The Podfile patch above sets DEPLOYMENT_LOCATION=YES + INSTALL_PATH=$(LOCAL_APPS_DIR)
          # so that the ARCHIVE step (later) populates Products/Applications/ in the .xcarchive.
          # But `xcodebuild build` does NOT run the deploy phase — with those settings active,
          # build redirects BUILT_PRODUCTS_DIR to the deployment location AND skips populating
          # it (no install phase), so Products/Release-iphonesimulator/<App>.app is never
          # written. Override both to defaults for the SIM build only. Confirmed via run
          # 26223284361 — without this, only intermediates (.hmap, .pch, .dia) emit.
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination "$DEST" \
            -derivedDataPath $RUNNER_TEMP/sim-build \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            DEPLOYMENT_LOCATION=NO \
            INSTALL_PATH=
          echo "=== Built .app(s) ==="
          find $RUNNER_TEMP/sim-build/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name "*.app" 2>/dev/null

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for t in d['devicetypes']:
              if 'iPhone-16' in t['identifier'] or 'iPhone-15' in t['identifier']:
                  print(t['identifier'])
                  break
          ")
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          ios = [r for r in d['runtimes'] if r.get('isAvailable') and 'iOS' in r.get('name', '')]
          ios.sort(key=lambda r: r['version'], reverse=True)
          print(ios[0]['identifier'] if ios else '')
          ")
          echo "device-type=$DEVICE_TYPE"
          echo "runtime=$RUNTIME"
          UDID=$(xcrun simctl create "maestro-test-$RANDOM" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app + grant permissions on simulator
        run: |
          set -u    # NOT -e or pipefail — find/grep pipes return non-zero on empty match
          # Discover the app — the Podfile patch sets DEPLOYMENT_LOCATION=YES
          # + INSTALL_PATH=$(LOCAL_APPS_DIR), so xcodebuild deploys the .app
          # to /tmp/<App>.dst/Applications/<App>.app for SIM Release builds
          # (not just for archives). Search both locations.
          # `-not -path *dSYM*` filters out dSYM bundles directly in find;
          # no pipe to grep (which would exit 1 on no-match and kill `set -e`).
          APP=$(find "$RUNNER_TEMP/sim-build/Build/Products/Release-iphonesimulator" /tmp \
                -maxdepth 5 -type d -name "*.app" -not -path "*dSYM*" 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app found in either Products dir or /tmp/*.dst/"
            echo "=== /tmp tree (any .app) ==="
            find /tmp -maxdepth 6 -type d -name "*.app" 2>/dev/null | head -30
            echo "=== sim-build tree (full) ==="
            find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 6 -type d 2>/dev/null | head -50
            echo "=== Anything Cinova-named anywhere ==="
            find /tmp "$RUNNER_TEMP" "$HOME/Library/Developer/Xcode" -maxdepth 8 -name "Cinova*" 2>/dev/null | head -20
            exit 1
          fi
          echo "Found app: $APP"
          set -e    # re-enable for the actual install commands
          echo "Installing $APP onto $SIM_UDID"
          xcrun simctl install "$SIM_UDID" "$APP"
          # Cinova declares camera/mic/location in Info.plist for SDK
          # completeness but the app doesn't actively use camera/mic
          # surfaces. Pre-grant location so the country-pref flow
          # doesn't hit a system dialog during Maestro.
          xcrun simctl privacy "$SIM_UDID" grant location  io.dynolabs.cinova || true
          xcrun simctl privacy "$SIM_UDID" grant photos    io.dynolabs.cinova || true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro flows
        # Maestro flows live at repo root, not under mobile/. Override
        # the job-level working-directory.
        working-directory: ${{ github.workspace }}
        env:
          # iOS driver (XCUITest) cold-boot is slow on CI. 10 min cap.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          # Stream simulator log so any crash trace is captured alongside
          # the maestro report. App name in process predicate is derived
          # from the Xcode scheme.
          xcrun simctl spawn "$SIM_UDID" log stream --predicate 'process == "${{ steps.scheme.outputs.scheme }}"' \
            > $RUNNER_TEMP/sim.log 2>&1 &
          LOG_PID=$!
          set +e
          maestro --device "$SIM_UDID" test --format=junit --output=$RUNNER_TEMP/maestro-junit.xml .maestro/00-all.yaml
          MAESTRO_EXIT=$?
          set -e
          kill $LOG_PID 2>/dev/null || true
          if [ -d ~/.maestro/tests ]; then
            mkdir -p $RUNNER_TEMP/maestro-debug
            cp -R ~/.maestro/tests $RUNNER_TEMP/maestro-debug/
          fi
          # Maestro's `takeScreenshot: NAME` writes NAME.png to the directory
          # from which maestro was invoked (github.workspace, the repo root).
          # Without this collection the screenshots are LOST. Captured under
          # $RUNNER_TEMP/maestro-screenshots/ for the artifact upload.
          mkdir -p $RUNNER_TEMP/maestro-screenshots
          find "$GITHUB_WORKSPACE" -maxdepth 2 -name "walk-*.png" -exec cp {} $RUNNER_TEMP/maestro-screenshots/ \; 2>/dev/null || true
          echo "=== walk screenshots captured ==="
          ls -la $RUNNER_TEMP/maestro-screenshots/ 2>/dev/null || true
          # NATIVE-CRASH DETECTION — Maestro reports flows passed if it
          # didn't actively detect a failed assertion, but the JS
          # ErrorBoundary doesn't catch native bridge crashes. Grep the
          # sim log for fatal patterns and fail independently.
          if grep -qE "Terminating app due to uncaught exception|signal SIGABRT|EXC_BAD_ACCESS|libsystem_kernel\.dylib.*__pthread_kill" $RUNNER_TEMP/sim.log; then
            echo "::error::Native crash detected in sim.log — see uploaded artifacts"
            grep -nE "Terminating|SIGABRT|EXC_BAD_ACCESS|Fatal Exception" $RUNNER_TEMP/sim.log | head -40
            exit 1
          fi
          exit $MAESTRO_EXIT

      - name: Upload Maestro artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            ${{ runner.temp }}/maestro-junit.xml
            ${{ runner.temp }}/maestro-screenshots/**
            ${{ runner.temp }}/maestro-debug/**
            ${{ runner.temp }}/sim.log
          if-no-files-found: warn
      # ───────────────────────────────────────────────────────────
      # END E2E GATE — anything below only runs on Maestro success.
      # ───────────────────────────────────────────────────────────

      - name: Build and archive (manual signing, fresh profile)
        # MANUAL signing using the App Store profile fastlane sigh just
        # installed. CODE_SIGN_STYLE=Automatic would require Apple to
        # also issue an Apple Development cert (account is at cert limit).
        run: |
          cd ios
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Dynolabs Cinova App Store"

      - name: Export IPA (manual zip from archive)
        # Xcode 26 on macos-latest broke `xcodebuild -exportArchive`.
        # The .xcarchive already contains a fully-signed .app — wrap it
        # in an .ipa (Payload/<App>.app ZIP) directly.
        run: |
          set -euo pipefail
          echo "=== Locate the archive ==="
          find $RUNNER_TEMP -maxdepth 4 -name "*.xcarchive" -o -name "*.app" 2>/dev/null | head -20 || true
          echo "=== Archive contents ==="
          if [ -d "$RUNNER_TEMP/app.xcarchive" ]; then
            ls -la "$RUNNER_TEMP/app.xcarchive/" || true
            ls -la "$RUNNER_TEMP/app.xcarchive/Products/" 2>/dev/null || true
            ls -la "$RUNNER_TEMP/app.xcarchive/Products/Applications/" 2>/dev/null || true
          fi
          APP=$(find "$RUNNER_TEMP/app.xcarchive" -name "*.app" -type d | head -1 || true)
          if [ -z "$APP" ]; then
            echo "::error::No .app found inside $RUNNER_TEMP/app.xcarchive"
            exit 1
          fi
          echo "=== Found app: $APP ==="
          mkdir -p $RUNNER_TEMP/export/Payload
          cp -R "$APP" $RUNNER_TEMP/export/Payload/
          IPA_NAME=$(basename "$APP" .app).ipa
          cd $RUNNER_TEMP/export
          zip -qr "$IPA_NAME" Payload
          rm -rf Payload
          ls -la $RUNNER_TEMP/export/

      - name: Upload to TestFlight
        # altool exits 0 even on validation failure ("UPLOAD FAILED" is
        # just a log line). Capture + grep + explicit-fail.
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/*.ipa \
            --type ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} 2>&1 | tee /tmp/altool.log
          if grep -qiE "UPLOAD FAILED|Validation failed|ERROR:" /tmp/altool.log; then
            echo "::error::altool reported failure — see log above"
            exit 1
          fi
          echo "::notice::Upload succeeded"

      - name: Assign uploaded build to "Founders" beta group
        # Internal beta groups default to hasAccessToAllBuilds=False; the
        # API rejects PATCHing that to True. Without an explicit
        # POST /betaGroups/{id}/relationships/builds, new uploads reach
        # IN_BETA_TESTING but stay invisible to testers.
        # 204 = done. Do NOT re-poll the GET — eventually consistent.
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json, sys
          key_b64 = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']
          key = base64.b64decode(key_b64)
          token = jwt.encode(
              { 'iss': os.environ['APP_STORE_CONNECT_ISSUER_ID'],
                'iat': int(time.time()),
                'exp': int(time.time()) + 1200,
                'aud': 'appstoreconnect-v1' },
              key, algorithm='ES256',
              headers={ 'kid': os.environ['APP_STORE_CONNECT_KEY_ID'] })
          h = { 'Authorization': f'Bearer {token}' }
          base = 'https://api.appstoreconnect.apple.com'
          bundle_id = os.environ['BUNDLE_ID']
          run_number = os.environ['RUN_NUMBER']
          group_name = os.environ['BETA_GROUP_NAME']

          apps = requests.get(f'{base}/v1/apps?filter[bundleId]={bundle_id}', headers=h, timeout=20).json()
          if not apps.get('data'):
              print(f'::warning::App {bundle_id} not in ASC yet — skipping assignment'); sys.exit(0)
          app_id = apps['data'][0]['id']

          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h, timeout=20).json()
          group = next((g for g in groups['data'] if g['attributes']['name'] == group_name), None)
          if not group:
              print(f'::warning::Beta group "{group_name}" not found — create it once in ASC, future runs will pick it up'); sys.exit(0)
          group_id = group['id']

          # Two-phase wait:
          #   Phase 1 — build resource appears in ASC (altool returns before processing
          #             starts; the build row materialises within ~2 min)
          #   Phase 2 — build reaches an internally-testable state
          #             (processingState=VALID + buildAudienceType in INTERNAL_ONLY/APP_STORE_ELIGIBLE)
          #             First builds on a new ASC record take 15-30 min for export-compliance
          #             checks. Wait up to 45 min.
          # First build on run 26279869138 confirmed this: build appeared fast but
          # POST /v1/betaGroups/.../builds returned HTTP 422
          # "Build is not in an internally testable state" because processingState was
          # still PROCESSING when we tried to assign.
          build_id = None
          for attempt in range(20):    # ~6 min
              builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&filter[version]={run_number}&limit=1', headers=h, timeout=20).json()
              if builds.get('data'):
                  build_id = builds['data'][0]['id']
                  print(f'Build {run_number} appeared in ASC: id={build_id}')
                  break
              time.sleep(20)
          if not build_id:
              print(f'::warning::Build {run_number} not in ASC after 6 min — assignment skipped'); sys.exit(0)

          # Phase 2: wait for processingState=VALID. Apple sets:
          #   PROCESSING → VALID (testable) | INVALID (rejected)
          target_states = {'VALID'}
          for attempt in range(135):   # 45 min @ 20s
              b = requests.get(f'{base}/v1/builds/{build_id}', headers=h, timeout=20).json()
              ps = b.get('data', {}).get('attributes', {}).get('processingState')
              if ps in target_states:
                  print(f'Build processingState: {ps} ✓')
                  break
              if ps == 'INVALID':
                  print(f'::error::Build {run_number} INVALID — check ASC')
                  sys.exit(1)
              if attempt % 6 == 0:
                  print(f'Waiting on processingState (currently {ps}) … attempt {attempt+1}/135')
              time.sleep(20)
          else:
              print(f'::warning::Build still not VALID after 45 min (last: {ps}) — run asc-assign-build.yml manually once Apple finishes processing'); sys.exit(0)

          # Phase 2b: declare export compliance (usesNonExemptEncryption=false).
          # Apple's "internally testable" precondition needs this PATCH; without it,
          # POST /v1/betaGroups/.../builds returns HTTP 422 ENTITY_UNPROCESSABLE
          # "Build is not in an internally testable state" even though processingState
          # is VALID. Confirmed on builds 13 + 14: usesNonExemptEncryption was None
          # post-upload; PATCH to false made the build assignable immediately.
          # Long-term fix: add ITSAppUsesNonExemptEncryption=false to Info.plist via
          # app.config.ts so altool sets this attribute on upload, but the PATCH is
          # the safety-net that always works.
          ec_payload = {'data': {'type': 'builds', 'id': build_id,
                                  'attributes': {'usesNonExemptEncryption': False}}}
          r = requests.patch(f'{base}/v1/builds/{build_id}',
              headers={**h, 'Content-Type': 'application/json'},
              data=json.dumps(ec_payload), timeout=20)
          if r.status_code in (200, 204):
              print(f'Export compliance declared: usesNonExemptEncryption=false')
          elif r.status_code == 409:
              print(f'Export compliance already declared (409)')
          else:
              print(f'::warning::Export compliance PATCH HTTP {r.status_code}: {r.text[:300]}')
              # Don't fail — try assignment anyway, may already be declared

          # Phase 3: assign to beta group
          rel = { 'data': [ { 'type': 'builds', 'id': build_id } ] }
          r = requests.post(f'{base}/v1/betaGroups/{group_id}/relationships/builds',
              headers={**h, 'Content-Type': 'application/json'},
              data=json.dumps(rel), timeout=20)
          if r.status_code == 204:
              print(f'::notice::Build {run_number} assigned to "{group_name}" — TestFlight refresh will show it')
          else:
              print(f'::error::Assignment failed: HTTP {r.status_code} {r.text}')
              sys.exit(1)
          PY
        env:
          APP_STORE_CONNECT_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: io.dynolabs.cinova
          RUN_NUMBER: ${{ github.run_number }}
          BETA_GROUP_NAME: Founders
