name: asc-probe-deep (one-shot)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_B64:   ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - run: |
          python3 << 'PY'
          import os, json, time, base64, requests, jwt
          ki, ii = os.environ['ASC_KEY_ID'], os.environ['ASC_ISSUER_ID']
          key_blob = os.environ['ASC_KEY_B64']
          # secret may be base64 or raw PEM
          try:
              decoded = base64.b64decode(key_blob)
              if decoded.startswith(b'-----BEGIN'):
                  kp = decoded
              else:
                  kp = key_blob.encode()
          except Exception:
              kp = key_blob.encode()
          tok = jwt.encode({'iss': ii, 'iat': int(time.time()), 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'}, kp, algorithm='ES256', headers={'kid': ki})
          h = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          base_url = 'https://api.appstoreconnect.apple.com'
          BID = 'io.dynolabs.cinova'

          # Probe role
          print("=== Probe: GET /v1/users (whoami / role check) ===")
          r = requests.get(f'{base_url}/v1/users', headers=h, timeout=15)
          print(f"HTTP {r.status_code}")
          if r.status_code == 200:
              for u in r.json().get('data', [])[:10]:
                  a = u.get('attributes', {})
                  print(f"  {a.get('username')} roles={a.get('roles')} allAppsVisible={a.get('allAppsVisible')}")

          attempts = [
              ('POST /v1/apps minimal',
               f'{base_url}/v1/apps',
               {'data': {'type': 'apps', 'attributes': {
                   'bundleId': BID, 'name': 'Cinova', 'primaryLocale': 'en-US', 'sku': 'cinova-2026'}}}),
              ('POST /v1/apps with bundleId relationship',
               f'{base_url}/v1/apps',
               {'data': {'type': 'apps',
                         'attributes': {'name': 'Cinova', 'primaryLocale': 'en-US', 'sku': 'cinova-2026'},
                         'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': 'T8F2BSD4H7'}}}}}),
              ('POST /v2/apps',
               f'{base_url}/v2/apps',
               {'data': {'type': 'apps', 'attributes': {'bundleId': BID, 'name': 'Cinova'}}}),
              ('POST /v1/appCreates',
               f'{base_url}/v1/appCreates',
               {'data': {'type': 'appCreates', 'attributes': {'bundleId': BID, 'name': 'Cinova'}}}),
          ]
          for name, url, payload in attempts:
              print(f"\n--- {name} ---")
              r = requests.post(url, headers=h, json=payload, timeout=15)
              print(f"HTTP {r.status_code}")
              if r.status_code not in (200, 201):
                  print(r.text[:600])
              else:
                  print("CREATED:", json.dumps(r.json(), indent=2)[:400])
                  break
          PY
