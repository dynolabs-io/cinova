name: asc-current-state (real-time tester + build state)

on:
  workflow_dispatch:

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}'}
          base = 'https://api.appstoreconnect.apple.com'

          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          app_id = apps['data'][0]['id']

          # Tester current state — check if state transitioned (someone clicked the link)
          for email in ['hatyil@gmail.com', 'emrahbaysal@gmail.com']:
              t = requests.get(f'{base}/v1/betaTesters?filter[email]={email}', headers=h).json()
              for r in t.get('data', []):
                  a = r['attributes']
                  print(f"{email} id={r['id']} state={a.get('state')} inviteType={a.get('inviteType')}")

          # Per-build invitations — has anyone redeemed?
          print(f"\n=== List all betaTesterInvitations for this app ===")
          r = requests.get(f'{base}/v1/betaTesterInvitations?limit=20', headers=h)
          print(f"endpoint HTTP {r.status_code}")
          if r.status_code == 200:
              for inv in r.json().get('data', []):
                  print(f"  invitation id={inv['id']} attrs={inv.get('attributes')}")

          # Check ALL beta groups for this app
          print(f"\n=== All beta groups for cinova ===")
          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h).json()
          for g in groups.get('data', []):
              a = g['attributes']
              print(f"\n  {a['name']} id={g['id']}")
              print(f"    isInternal: {a.get('isInternalGroup')} hasAccessToAllBuilds: {a.get('hasAccessToAllBuilds')}")
              print(f"    publicLink: {a.get('publicLink')}")
              t = requests.get(f'{base}/v1/betaGroups/{g["id"]}/betaTesters?limit=20', headers=h).json()
              for tt in t.get('data', []):
                  ta = tt['attributes']
                  print(f"    tester: {ta.get('email')} state={ta.get('state')}")

          # Each tester's per-app permissions
          print(f"\n=== Per-tester apps + builds ===")
          for email in ['hatyil@gmail.com', 'emrahbaysal@gmail.com']:
              t = requests.get(f'{base}/v1/betaTesters?filter[email]={email}', headers=h).json()
              for r in t.get('data', []):
                  tid = r['id']
                  abuilds = requests.get(f'{base}/v1/betaTesters/{tid}/builds', headers=h).json()
                  print(f"\n  {email} builds: {len(abuilds.get('data', []))}")
                  for b in abuilds.get('data', []):
                      print(f"    - build id={b['id']} version={b['attributes'].get('version')} processingState={b['attributes'].get('processingState')}")
          PY
