name: asc-trigger-notify (force TestFlight notification)

on:
  workflow_dispatch:

# Apple's autoNotifyEnabled=True should push notifications to testers when builds
# become available. Force a re-trigger by toggling the flag, and also explicitly
# POST a beta-tester-builds relationship which sometimes triggers fresh apns push.

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          base = 'https://api.appstoreconnect.apple.com'

          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          app_id = apps['data'][0]['id']
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&filter[version]=14', headers=h).json()
          build_id = builds['data'][0]['id']

          # Get buildBetaDetail resource for build 14
          r = requests.get(f'{base}/v1/builds/{build_id}/buildBetaDetail', headers=h).json()
          if 'data' in r and r['data']:
              bbd_id = r['data']['id']
              attrs_before = r['data']['attributes']
              print(f"buildBetaDetail id={bbd_id}")
              print(f"  internalBuildState: {attrs_before.get('internalBuildState')}")
              print(f"  externalBuildState: {attrs_before.get('externalBuildState')}")
              print(f"  autoNotifyEnabled: {attrs_before.get('autoNotifyEnabled')}")

              # Toggle autoNotify off → on to force re-evaluation
              for v in [False, True]:
                  patch = {'data': {'type': 'buildBetaDetails', 'id': bbd_id,
                                     'attributes': {'autoNotifyEnabled': v}}}
                  pr = requests.patch(f'{base}/v1/buildBetaDetails/{bbd_id}', headers=h, json=patch, timeout=20)
                  print(f"  PATCH autoNotifyEnabled={v}: HTTP {pr.status_code}")
                  if pr.status_code not in (200, 204):
                      print(f"    body={pr.text[:300]}")

          # Try the explicit "notify" endpoint (some versions of ASC API expose this)
          # POST /v1/builds/{id}/relationships/notifyAppleSubmissions or similar
          # Trying a few candidates:
          for endpoint in [
              f'/v1/builds/{build_id}/notifyBetaTesters',
              f'/v1/buildBetaDetails/{bbd_id}/notifyBetaTesters',
              f'/v1/builds/{build_id}/relationships/notification',
          ]:
              r = requests.post(f'{base}{endpoint}', headers=h, json={}, timeout=10)
              print(f"\nPOST {endpoint}: HTTP {r.status_code}")
              if r.status_code in (200, 201, 204):
                  print(f"  SUCCESS!")
              else:
                  print(f"  {r.text[:150]}")

          # Final state
          print(f"\n=== Final state: Build 14 individualTesters ===")
          ind = requests.get(f'{base}/v1/builds/{build_id}/individualTesters', headers=h).json()
          for t in ind.get('data', []):
              a = t['attributes']
              print(f"  - {a.get('email')} state={a.get('state')}")

          # Confirm visibility via per-tester GET (just to verify the relationship)
          for email in ['hatyil@gmail.com', 'emrahbaysal@gmail.com']:
              t = requests.get(f'{base}/v1/betaTesters?filter[email]={email}', headers=h).json()
              for r in t.get('data', []):
                  ab = requests.get(f'{base}/v1/betaTesters/{r["id"]}/builds', headers=h).json()
                  print(f"  {email} → {len(ab.get('data', []))} builds visible")
          PY
