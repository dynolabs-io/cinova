name: asc-public-link (autonomous install path)

on:
  workflow_dispatch:

# Strategy: internal-group + email-invite path is fragile (Apple mail delivery
# delays, ASC team-Apple-ID-on-phone-TestFlight mismatch, "NOT_INVITED" state
# weirdness for Account Holders). The robust autonomous path is:
#   1. Create EXTERNAL beta group with publicLinkEnabled=true
#   2. Add build 14 to that external group
#   3. Submit for beta-app-review (POST /v1/betaAppReviewSubmissions)
#   4. Read the public link URL (testflight.apple.com/join/XXXX)
#   5. That URL works for ANY Apple ID, no email needed, no inbox lookup
#
# Apple's first-build beta review historically takes ~24h, but in 2025 they
# largely automated it; many first builds clear in <1h. Worth trying.

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json, sys
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          base = 'https://api.appstoreconnect.apple.com'

          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.cinova', headers=h).json()
          app_id = apps['data'][0]['id']
          print(f'App ID: {app_id}')

          # Get build 14
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&filter[version]=14', headers=h).json()
          build_id = builds['data'][0]['id']
          print(f'Build 14: {build_id}')

          # === Step 0: probe existing invitation details for any redemption URL ===
          print("\n=== Existing invitation details ===")
          # List invitations attached to existing tester for cinova
          for email in ['hatyil@gmail.com', 'emrahbaysal@gmail.com']:
              tt = requests.get(f'{base}/v1/betaTesters?filter[email]={email}&include=apps,betaGroups', headers=h).json()
              for t in tt.get('data', []):
                  print(f"  tester {email} id={t['id']} attrs={t['attributes']}")

          # === Step 1: create or find an external group "Public Beta" ===
          print("\n=== External group with public link ===")
          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h).json()
          ext_group = None
          for g in groups.get('data', []):
              if g['attributes']['name'] == 'Public Beta':
                  ext_group = g; break
          if not ext_group:
              payload = {'data': {
                  'type': 'betaGroups',
                  'attributes': {
                      'name': 'Public Beta',
                      'isInternalGroup': False,
                      'publicLinkEnabled': True,
                      'publicLinkLimitEnabled': False,
                  },
                  'relationships': {'app': {'data': {'type': 'apps', 'id': app_id}}}
              }}
              r = requests.post(f'{base}/v1/betaGroups', headers=h, json=payload, timeout=20)
              print(f"create external group HTTP {r.status_code}")
              if r.status_code in (200, 201):
                  ext_group = r.json()['data']
                  print(f"  created id={ext_group['id']}")
              else:
                  print(f"  body={r.text[:600]}")
                  sys.exit(1)
          else:
              print(f"  found existing id={ext_group['id']}")

          group_id = ext_group['id']

          # === Step 2: enable publicLink if not already ===
          ga = ext_group['attributes']
          if not ga.get('publicLinkEnabled'):
              patch = {'data': {'type': 'betaGroups', 'id': group_id,
                                'attributes': {'publicLinkEnabled': True}}}
              r = requests.patch(f'{base}/v1/betaGroups/{group_id}', headers=h, json=patch, timeout=20)
              print(f"enable publicLink HTTP {r.status_code}")

          # === Step 3: assign build 14 to the external group ===
          rel = {'data': [{'type': 'builds', 'id': build_id}]}
          r = requests.post(f'{base}/v1/betaGroups/{group_id}/relationships/builds',
                            headers=h, json=rel, timeout=20)
          print(f"\nattach build 14 to external group HTTP {r.status_code}")
          if r.status_code not in (200, 204):
              print(f"  body={r.text[:500]}")

          # === Step 4: read back the public link URL ===
          g = requests.get(f'{base}/v1/betaGroups/{group_id}', headers=h).json()
          attrs = g.get('data', {}).get('attributes', {})
          print(f"\n=== Group attributes ===")
          for k in ['name', 'publicLinkEnabled', 'publicLink', 'publicLinkId', 'publicLinkLimit', 'isInternalGroup']:
              print(f"  {k}: {attrs.get(k)}")

          # === Step 5: submit for beta-app-review ===
          # First external build of a new app needs Apple's review.
          print(f"\n=== Beta App Review submission ===")
          bars_payload = {'data': {
              'type': 'betaAppReviewSubmissions',
              'relationships': {'build': {'data': {'type': 'builds', 'id': build_id}}}
          }}
          r = requests.post(f'{base}/v1/betaAppReviewSubmissions', headers=h, json=bars_payload, timeout=20)
          print(f"submit HTTP {r.status_code}")
          if r.status_code in (200, 201):
              print(f"  submitted: {r.json()['data']['id']}")
              print(f"  attributes: {r.json()['data']['attributes']}")
          else:
              print(f"  body={r.text[:600]}")

          # === Step 6: check current review status ===
          rev = requests.get(f'{base}/v1/builds/{build_id}/betaAppReviewSubmission', headers=h).json()
          print(f"\n=== Build 14 review status ===")
          print(json.dumps(rev, indent=2)[:800])
          PY
