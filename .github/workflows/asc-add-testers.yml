name: asc-add-testers (one-shot)

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json
          kb = os.environ['PRIVATE_KEY_B64']
          try:
              d = base64.b64decode(kb)
              key = d if d.startswith(b'-----BEGIN') else kb.encode()
          except Exception:
              key = kb.encode()
          tok = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                            'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['KEY_ID']})
          h = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          base = 'https://api.appstoreconnect.apple.com'
          GROUP_ID = 'ffb228b9-9ad3-44aa-90e7-967bb06576bd'  # Founders

          testers = [
              {'email': 'hatyil@gmail.com',       'firstName': 'Hatice',  'lastName': 'Baysal'},
              {'email': 'emrahbaysal@gmail.com',  'firstName': 'Emrah',   'lastName': 'Baysal'},
          ]
          for t in testers:
              payload = {'data': {
                  'type': 'betaTesters',
                  'attributes': t,
                  'relationships': {'betaGroups': {'data': [{'type': 'betaGroups', 'id': GROUP_ID}]}},
              }}
              r = requests.post(f'{base}/v1/betaTesters', headers=h, json=payload, timeout=20)
              print(f"\n--- {t['email']} ---")
              print(f"HTTP {r.status_code}")
              if r.status_code in (200, 201):
                  print(f"  created id={r.json()['data']['id']}")
              elif r.status_code == 409:
                  # Already exists — find them and add to the group
                  existing = requests.get(f'{base}/v1/betaTesters?filter[email]={t["email"]}', headers=h).json()
                  if existing.get('data'):
                      tester_id = existing['data'][0]['id']
                      # POST relationship: add this tester to the group
                      rel = {'data': [{'type': 'betaTesters', 'id': tester_id}]}
                      r2 = requests.post(f'{base}/v1/betaGroups/{GROUP_ID}/relationships/betaTesters',
                                          headers=h, json=rel, timeout=20)
                      print(f"  already exists id={tester_id} → group-add status={r2.status_code}")
              else:
                  print(f"  body={r.text[:600]}")

          # Verify
          print("\n=== Final state of Founders group ===")
          tt = requests.get(f'{base}/v1/betaGroups/{GROUP_ID}/betaTesters', headers=h).json()
          for t in tt.get('data', []):
              a = t['attributes']
              print(f"  - {a.get('email')} state={a.get('state')} inviteType={a.get('inviteType')}")
          PY
