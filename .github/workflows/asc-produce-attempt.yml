name: asc-produce-attempt (one-shot)

on:
  workflow_dispatch:

jobs:
  produce:
    runs-on: macos-latest
    timeout-minutes: 8
    env:
      ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_B64:   ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - run: |
          set -uo pipefail
          mkdir -p ~/private_keys
          echo "$ASC_KEY_B64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 || echo "$ASC_KEY_B64" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Build api-key JSON for fastlane
          cat > /tmp/api_key.json <<EOF
          {
            "key_id":   "$ASC_KEY_ID",
            "issuer_id":"$ASC_ISSUER_ID",
            "key":      $(cat ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 | jq -Rs .),
            "duration": 1200,
            "in_house": false
          }
          EOF
          fastlane --version
          echo "=== Try produce with --api_key_path (might work in newer fastlane) ==="
          set +e
          fastlane produce \
            --api_key_path /tmp/api_key.json \
            --app_identifier io.dynolabs.cinova \
            --app_name "Cinova" \
            --language English \
            --team_id "$APPLE_TEAM_ID" \
            --skip_itc false 2>&1 | tee /tmp/produce-apikey.log
          echo "exit=$?"
          echo ""
          echo "=== Try produce with --api-key-path (dash variant) ==="
          fastlane produce \
            --api-key-path /tmp/api_key.json \
            --app_identifier io.dynolabs.cinova \
            --app_name "Cinova" \
            --team_id "$APPLE_TEAM_ID" 2>&1 | tee /tmp/produce-apikey2.log | head -50
          echo "exit2=$?"
          echo ""
          echo "=== Show produce help to see what auth flags it accepts ==="
          fastlane produce --help 2>&1 | head -80
