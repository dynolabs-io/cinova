name: ci

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci || npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
